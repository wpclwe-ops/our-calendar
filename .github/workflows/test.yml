name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app scripts
      - run: node --check web/app.js
      - run: node --check web/settings.js
      - run: node --check web/smart-events.js
      - run: node --check web/google-import.js
      - run: node --check web/recurrence.js
      - run: node --check web/calendar-navigation.js
      - run: node --check web/calendar-week.js
      - run: node --check web/calendar-time.js
      - run: node --check web/calendar-touch.js
      - run: node --test tests/*.test.cjs
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-event-allday-range.cjs
      - run: node tests/browser-form-font-size.cjs
      - run: node tests/browser-google-import.cjs
      - run: node tests/browser-smart-events.cjs
      - run: node tests/browser-settings.cjs
      - run: node tests/browser-calendar-week.cjs
      - run: node tests/browser-calendar-design.cjs
      - run: node tests/browser-calendar-tab-swipes.cjs
      - run: node tests/browser-calendar-touchbar.cjs
      - run: node tests/browser-calendar-interactions.cjs
      - run: node tests/browser-calendar-navigation.cjs

